conversation:
  max_turns: 20               # 履歴として保持する往復数 (短期記憶)
  # 複数人会話向けの宛先判定。DiscordアカウントIDだけで人物を確定せず、
  # 声紋・会話ターン・発話内容を組み合わせて、AIへ向けられた発話だけに応答する。
  addressing:
    respond_threshold: 0.75   # この値以上なら通常応答
    brief_threshold: 0.45     # この値以上なら短く応答
    observe_threshold: 0.35   # この値以上は状態のみ更新して原則発話しない
    continuation_s: 45.0      # 同じDiscord入力の会話継続を保持する最大秒数
    use_llm_for_ambiguous: false # 将来用。既定は遅延を増やさない同期ルールのみ
  response_length: short      # short / medium。Response Plannerの標準長
  response_depth: 1           # 通常時に説明を深掘りする段数 (0〜2)
  # 本当に迷っている時だけ、言い淀み・間・考えながらの話し方を許可する。
  # 「たまに人間らしく詰まる」演出ではない。聞き取りが怪しい、指しているものが
  # 特定できない、思い出せない、根拠がない、意見が定まらない——これらの信号が
  # 実際に立ったターンだけが対象で、確信している時は明示的に禁止する (憲法第1条)。
  hesitation:
    enabled: true
    max_gestures: 2           # 1ターンに出せる仕草の上限。2は複数の意味で迷った時だけ
    unit_pause_ms: 320        # 「…」1つぶんの無音
    max_pause_ms: 900         # 「…………」でもこれ以上は空けない
    trailing_pause_ms: 220    # 「〜かな」のように言い切らずに終えた時の一拍
    filler_speed: 0.88        # 「うーん」等の言い淀み部分だけを遅くする倍率
  # 直前の自分の返答をそのまま繰り返した時は発話しない。
  # 「マジでそう。」のように新しい内容のないターンでは、モデルの目の前で最も
  # 目立つ文章が自分の前の返答になり、それを一字一句なぞることがある。
  # 語彙リストで個別に潰すのではなく、出来上がった文を比べて判定する。
  suppress_repeated_reply: true
  # ConversationPlannerの判断が、実際の発話に現れたかを測る。
  #
  # 「毎回似た構成になる」という症状は、(a) Plannerが毎回同じ選択をしている、
  # (b) Plannerは変えているが発話が従っていない、のどちらでも起きる。
  # 対処は正反対で、(b)なら会話エンジンを足しても何も変わらない。
  # 追加のLLM呼び出しはゼロ。発話本文は記録しない（憲法第12条）。
  #
  # Planner有無の比較は dialogue.conversation_generation.enabled を切り替えて
  # 同じ発話列を2セッション流し、下記JSONLを集計する。
  metrics:
    enabled: true
    window: 8                 # 直近何ターンで重複・偏りを見るか
    path: logs/conversation_metrics.jsonl   # 空にすると書き出さない
  turn_closure:
    enabled: true             # 相槌・理解だけで会話が自然に閉じる時はLLMを呼ばず沈黙を選ぶ
    max_feedback_chars: 48    # これより長い発話は新しい内容を含む可能性が高いため終了扱いしない
    brief_reply_on_gratitude: true # 一対一または明示的な「ありがとう」へは短く返せる
  debug_transcripts: false    # true のときだけ会話イベントに認識全文を含める
  group_aizuchi:              # 複数人通話で、宛先が曖昧な発話にたまに相槌だけ打つ
    enabled: true
    probability: 0.35         # 相槌を打つ確率 (0.0〜1.0)
    min_interval_s: 20        # 直近に自分が話してからこの秒数は相槌しない

group_conversation:           # 複数人VCでは名前呼びだけに依存せず、発言権を人間へ優先する
  enabled: true               # false で従来の addressing 判定へ戻す
  response_threshold: 0.65
  wait_threshold: 0.40
  optional_join_threshold: 0.55
  human_priority_default_ms: 850

privacy:                      # LLMへ渡す前の記憶制限と、出力時の高感度文字列ガード
  enabled: true
  context_gate_enabled: true
  output_check_enabled: true

mind:                         # こころ: 記憶 (中期/長期) + 成長する人格
  enabled: true
  data_dir: data              # 記憶DB・人格JSONの保存先 (ペルソナごとに別ファイル)
  growth_rate: 1.0            # 性格・好みの変化速度 (0=変化しない / 2=2倍速)。
                              # ペルソナ別に persona.presets.<key>.growth_rate で上書き可能
  max_memories: 2000          # 長期記憶の上限 (超えると重要度の低いものから忘れる)
  transcript:                 # 会話ログ記憶: 要約でなく実際の発言+その時の感情を残す
    enabled: true
    retention_days: 45        # この日数を過ぎた会話ログは忘れる (人間らしい忘却)
    top_k: 3                  # 意味検索でプロンプトに混ぜる会話断片の最大数
    temporal_max: 6           # 「昨日何話した?」等の日付質問で読み込む最大件数
    max_items: 8000           # 会話ログの総件数上限 (古いものから削除)
  backup:                     # 人格・記憶データ (全ペルソナ) の自動バックアップ
    enabled: true
    interval_minutes: 60      # 定期バックアップの間隔 (最短5分)。内容が同じ回はスキップ
    on_exit: true             # アプリ終了時にもバックアップする
    keep_auto: 14             # 自動系 (定期/終了時/復元前退避) の保持世代数
    keep_manual: 20           # 手動バックアップの保持世代数 (自動とは別枠)
    dir: data/backups         # 保存先。別ドライブ等に変えるとPC故障にも強くなる
  embedding:
    backend: local            # local=sentence-transformersで意味検索 / none=キーワード検索
    model: intfloat/multilingual-e5-small   # 日本語対応・軽量 (初回に約450MBダウンロード)
    device: cpu               # VRAM節約のためCPU推奨 (十分高速)
  recall:
    top_k: 5                  # 1ターンで思い出す記憶の最大件数
    min_score: 0.78           # 想起の類似度しきい値 (e5系は0.75〜0.85が目安)
    timeout_s: 4              # 想起の時間制限。超えたらスキップして応答を優先
    mention_score: 0.88       # この総合スコア以上の記憶だけ自然な発話で言及を許可
  reflection:
    every_turns: 6            # 何ターンごとに内省 (記憶抽出+人格更新) するか
    min_idle_s: 15            # 短い考え込みの最中に内省を始めず、会話応答との競合を避ける
    timeout_s: 120            # 内省LLM呼び出しの時間制限
    cancel_on_user_activity: true  # 新しい発話が来たら内省LLMを中断し、会話応答を最優先する
  relationship:
    enabled: true             # 相手ごとの多軸関係性。応答開始時のLLM呼び出しは増やさない
    growth_rate: 1.0
    max_change_per_event: 0.025
    max_change_per_reflection: 0.050
    max_change_per_session: 0.120
    positive_multiplier: 1.00
    negative_multiplier: 1.20
    repair_multiplier: 1.10
    max_recent_events: 20
    # 他のペルソナが持ち主として書かれている関係値ファイルを、それでも
    # 読むか（Phase 7D ⑥ の互換 fallback）。**既定は読まない。**
    # 読まない時は書き込みも止める——空で上書きすると、読めないより
    # ずっと悪い形（相手のなかよし度が消える）になるため。
    allow_foreign_persona_file: false
    allow_explicit_person_dislike: false
    decay:
      irritation_half_life_hours: 4
      social_fatigue_half_life_hours: 8
      caution_half_life_days: 14
      unresolved_hurt_passive_half_life_days: 60
    defaults:
      trust: 0.50
      psychological_safety: 0.65
      respect: 0.50
      interest: 0.50
      comfort: 0.50
      reciprocity: 0.50
      caution: 0.10
      unresolved_hurt: 0.00
      repair_willingness: 0.80

dialogue:                     # Realtime dialogue intelligence (saved per persona)
  enabled: true
  personality_modules:        # 各ペルソナ未設定時の既定値。GUIでペルソナごとに調整可能
    defaults:
      curiosity: 0.70
      humor: 0.55
      playfulness: 0.55
      cheekiness: 0.35
      spontaneity: 0.50
      emotional_expression: 0.60
      suggestion: 0.58
      contrarian: 0.48
      empathy: 0.62
      topic_shift: 0.48
  conversation_generation:   # Planner -> Surface Realizer -> Critic (LLM呼出しは増やさない)
    # 【2026-07-29 対照実験の結果】有効/無効で同じ台本を流したところ、
    # 冒頭ハッシュが **7/8で一致** した（無効側の記録は metrics_planner_off.jsonl）。
    # 無効側では1番と5番が語尾・文字数まで完全一致——別の入力に同じ返答を返した。
    # つまりこの738tokは書き出しをほとんど動かしていない。
    # ただし削除はしていない: プロンプト全体を削る作業の中で扱う。
    enabled: true
    candidate_count: 4        # 毎ターン比較する話題・会話展開の候補数 (2-6)
    style_repeat_penalty: 0.72 # 直近と同じ話し方を避ける強さ (0-1)
    emotion_inertia: 0.78     # AI感情の慣性。高いほど急に気分が変わらない (0.45-0.95)
    recent_reply_avoidance:
      # 2026-07-29自動A/Bでは冒頭重複率0.25→0.25で差なし。
      # 質問率は下がったが、常時ONの根拠には不足するため実験用として既定OFF。
      enabled: false          # trueで、直近の実返答の冒頭だけを今回の重複回避材料にする
      count: 4                # 渡す直近返答数。本文全体や会話ログは複製しない
      max_chars: 48           # 1件あたり冒頭・最初の一文の最大文字数
      max_total_chars: 280    # 動的コンテキスト全体の上限。追加LLM呼出しはゼロ
  # 一度のLLM生成前に、直接回答・短い反応・意見・遊び・話題展開・質問を
  # 共通Kernelで比較する。候補ごとの文章生成は行わないため応答遅延は増えない。
  selection_kernel:
    enabled: true
  # 事実DBではなく、短い話題ラベル同士の関連だけを保持する。
  # Discordグループ由来の関連は現在の実行セッション内でのみ再利用する。
  semantic_graph:
    enabled: true
    max_nodes_per_user: 120
  emotional_memory:
    min_confidence: 0.75      # Store only high-confidence emotion observations
  curiosity:
    min_turn_interval: 3      # Minimum turns between AI-initiated follow-up questions
    threshold: 0.48           # 関連した自然な質問を提案する積極性 (低いほど増える)
  memory:
    min_importance_to_store: 45  # 0-100; discard low-value one-off memories

conversation_engine:
  variant: enhanced          # baseline / enhanced / experimental

# 各モジュールの判断を、LLMへ渡す前に一つのTurnFrameへ統合する。
# 訂正・文脈参照・質問・活動状態の優先順位をここで確定し、検索や好奇心が
# 会話修復より先に走ることを防ぐ。新しい記憶DBではなく、既存状態のread model。
conversation_kernel:
  enabled: true
  max_frames: 24             # 診断用に保持する直近TurnFrame数（会話履歴には追加しない）
  # 「それ」「さっきのおすすめ」の解決に使う直近会話数。
  # Web検索せず、まず実際の会話履歴から指示対象を特定する。
  recent_transcripts: 6

# 遊び・共同作業の「正本状態」。会話履歴ではなく、STT finalからの
# append-onlyイベント台帳を使って手番・ルール・確定事実を管理する。
fact_grounding:
  enabled: true
  canonical_activity_state: true
  activity_event_ledger: true
  grounded_output_check: true
  correction_mode: true
  input_router_enabled: true       # false で旧来の「全入力=ゲーム手」互換動作へ戻す
  max_identical_guard_responses: 1 # 同じ手番ガードの2回目で再構築モードへ移行
  ai_move_max_reproposals: 1       # AI候補が不正なら同一stateで再提案できる回数
  ai_move_transaction_enabled: true # false で旧候補処理へ戻すための互換フラグ
  max_active_sessions: 1
  max_state_history: 200
  japanese_readings:          # 形態素解析が無い環境でも活動用に確定できる読み
    お米: こめ
    米: こめ

conversation_features:
  mode: normal               # conservative / normal / expressive / debug_showcase
  developer_ui: true        # true=こころ画面に候補・Critic・学習・品質指標を表示
  modes:
    conservative:
      feature_activation_multiplier: 0.5
    normal:
      feature_activation_multiplier: 1.0
    expressive:
      feature_activation_multiplier: 1.4
    debug_showcase:
      feature_activation_multiplier: 2.0
  debug:
    force_feature: null      # 本番はnull。機能名を指定すると安全条件内で強制候補化

features:
  humor_engine: true
  casual_conversation_engine: true
  story_engine: true
  imagination_engine: true
  playful_fantasy_engine: true
  world_knowledge_engine: true
  self_growth: true
  relationship_evolution: true
  value_system: true
  experience_memory: true

time_awareness:               # 現在時刻・時間帯・過去の話題をいつ話したか
  enabled: true
  timezone: Asia/Tokyo
  max_topics: 48              # ペルソナごとに保持する時刻付き話題の上限

discord:                      # Discord連携 (python run.py --discord で起動)
  token: ${DISCORD_BOT_TOKEN} # Botトークン (.env に設定)
  command_prefix: "!"         # !join でVC参加 / !leave で退出
  # direct_dave: Node/Dysnomia sidecar decrypts Discord audio per account.
  # loopback: retain the former WASAPI capture path as a safe fallback.
  receive_mode: direct_dave
  direct_dave_port: 0  # per-run localhost port; prevents stale sidecar collisions
  direct_reconnect_attempts: 3  # DAVE sidecar IPCが落ちた場合の自動再接続回数
  direct_voiceprint_match_threshold: 0.72  # Account ID is never a voiceprint identity
  # **意味が変わった** (Phase 6D)。true は「挨拶を検討してよい」。
  # 「必ず固定文を喋る」ではない。実際に話すかどうかは、
  # 他の候補と同じ列で Action Selector が決め、Speech Gate が通す。
  greet_on_join: true
  # 挨拶を認知経路へ通すか。**false の間は従来の固定文。**
  # true にすると固定文の直接TTS経路は使われない（二重挨拶の禁止）。
  cognitive_greeting_enabled: false
  # 出ていく人への一言。**毎回は要らない**ので既定オフ。
  # 作るのは、直前までその人と話していた時だけ。
  farewell_opportunity_enabled: false
  known_voices_only: false   # Discord専用仮想出力では未登録の通話相手も受け付ける
                              # ※動画/BGMも拾う可能性 → Discordの音だけを別デバイスに分けると安全
                              # true=登録済みの声だけ反応(動画除け)だが新しい人はポチと呼ぶ必要
  loopback_match_threshold: 0.35  # 通話相手の声紋照合の緩さ(低いほど緩い=一度覚えた人が
                              # 外れにくいが別人と混同しやすい)。Discord圧縮音声は声紋が
                              # 不安定なので既定0.35と緩め。0.5でやや厳しめ
  loopback_vad:
    start_threshold: 0.35
    end_threshold: 0.22
    start_frames: 2
    end_silence_ms: 700
    min_speech_ms: 180
    pre_roll_ms: 384
    energy_threshold: 0.004
    energy_end_threshold: 0.0025
    max_utterance_s: 25
  loopback_min_rms: 0.0025
  streamer_name: チビ         # 配信者本人(=マイク側)の名前。通話ループバック(他人)の
                              # 声紋照合からこの人を除外し、他人が本人と誤判定されるのを防ぐ
                              # (マイク側の識別で自動補正される)
  respond_all: false           # true=全発話に応答 / false=名前を呼ばれた時と会話直後のみ
  wake_words: [ニューロ, neuro, ポッポ, ぽっぽ, ポポ, ぽぽ, ポチ, ぽち] # Discord STTの短い呼びかけ揺れも含める
  follow_up_s: 10.0             # 返事のあとこの秒数は呼びかけなしでも会話の続きとして応答
  echo_text: false            # false=音声応答を一般テキストチャンネルへ投稿しない
  screen_share:
    enabled: true             # 「画面共有見て」でOBS経由の継続認識を開始
    backend: obs              # 現在はOBS。将来のDAVE映像直接受信と差し替える境界
    obs_source_name: Discord画面共有  # Discord共有画面を取り込むOBSソース名
    max_output_tokens: 240    # ゲーム名・状況・画面内文字を省略せず返す共有画面専用上限
    capture_max_width: 1280   # Discord UI内の小さい共有映像・文字を潰さない詳細幅
    minecraft_source_name: null # nullならvideo.obs.source_name（既定「マイクラ」）を使う
    minecraft_max_output_tokens: 220 # 構造化JSONが途中切れしない最小余裕。切れると状態・イベントを利用できない
    minecraft_capture_max_width: 768 # HUD判別を保ちつつ12B映像prefillを軽量化
    capture_fps: 1.0          # 最新フレーム優先。全フレームをLLMへ送らない
    max_frames_per_analysis: 1
    fresh_on_explicit_query: true
    explicit_wait_timeout_sec: 2.5  # 明示質問で待てる追加時間。超過時は時刻付き直近状態
    direct_answer_timeout_sec: 18.0 # 「今」の質問は撮り直した1枚を待ち、二重LLM生成せず直接回答
    reasoning_refresh_timeout_sec: 6.5 # 持ち物・攻略判断はここまで最新画面を待ち、以後は時刻付き状態+知識で会話生成

music_recognition:            # 実音源の曲名認識。明示要求時だけ直近音声を外部APIへ送信
  enabled: true               # true にして AUDD_API_TOKEN 環境変数を設定すると有効
  provider: audd
  token_env: AUDD_API_TOKEN
  capture_source: loopback     # ローカルは本人マイクでなくWindowsの再生音をAudDへ送る
  loopback_device: null        # null=Windows既定の出力。外部YouTubeが鳴る出力endpoint IDも指定可能
  live_capture_seconds: 8.0    # 質問後、この秒数だけ現在の再生音を取得（内蔵プレイヤーは既知曲名を即答）
  capture_seconds: 12.0        # Discord受信音声の直近保持時間（互換設定）
  min_audio_seconds: 5.0
  min_rms: 0.003               # これ未満は無音としてAPIへ送らない
  timeout_s: 12.0

humming_recognition:          # 鼻歌・口笛の曲名認識 (ACRCloudのHumming対応プロジェクトが必要)
  enabled: false
  host: None                     # ACRCloudダッシュボードの Host (例: identify-eu-west-1.acrcloud.com)
  access_key_env: ACRCLOUD_ACCESS_KEY
  access_secret_env: ACRCLOUD_ACCESS_SECRET
  min_audio_seconds: 3.0
  min_rms: 0.008
  timeout_s: 15.0
  arm_timeout_s: 20.0

music:                        # 音楽再生 (VCで「〇〇流して/止めて/次」)。要 yt-dlp + FFmpeg
  enabled: true
  default_query: 作業用BGM     # 曲名を言わず「なんか流して」のときに検索する語
  intent_planner_enabled: true # LLMが文脈上の実行依頼かを判断してから操作する
  intent_planner_timeout_s: 5.0 # 意図判定の待機上限。失敗時は安全な規則判定へ戻す

speaker:                      # 話者識別 (声で相手を覚える)
  enabled: true
  device: cpu                 # 声紋モデルの実行デバイス (CPUで1秒弱・VRAM消費なし)
  model: full                 # full=フル精度(約380MB・高精度) / quantized=軽量(約100MB・精度低)
                              # ※変更すると声紋の互換性がなくなり話者リストはリセットされる
  threshold: 0.70             # これ以上の類似度=確実に同一人物 (声紋を追加学習)
  new_threshold: 0.50         # これ未満=明らかに別人 (新規ゲスト登録)。中間は「一番近い人」扱い
  # 会話中に話者名が入れ替わるのを防ぐヒステリシス。声紋スコアはターン毎に数%揺れるため、
  # 直近に話した人を優先し、他人がこの差以上に上回った時だけ切り替える。
  sticky_window_s: 90.0       # 直近この秒数以内に話した人を「継続中の話者」とみなす
  sticky_margin: 0.08         # 乗り換えに必要な類似度の差。0にするとヒステリシス無効
  # 同一人物が場面ごとに別プロファイルになるのを検出して統合を提案する閾値。
  # 例: ローカルマイクで「チビ」、Discordのニックネームで「ジーレン」として
  # 別々に登録されると、なかよし度も会話プロファイルも2人分に分裂する。
  merge_suggestion_threshold: 0.82  # この一致度以上の組をこころ画面で提案 (自動統合はしない)
  ask_name: true              # 名前を知らない相手には会話の流れで名前を聞く
  timeout_s: 4.0              # 識別の時間制限 (超えたら前回の相手として続行)
  migrate_legacy_shared_once: true  # 旧 speakers.json は現在のペルソナへ一度だけ引継ぎ、以後はペルソナ別に分離

# ============================================================
# 認知カーネル（行動選択層）
#
# 文章を作る前に「何をするか」を決める層。話す以外の選択肢——黙る、聞き返す、
# 警告する、中断した話を再開する、覚えるだけ——が構造として存在しなかったので、
# それを候補として比べられるようにしたもの。
#
#   入力 → 状況解釈 → 内部状態参照 → 行動候補 → 行動選択
#        → 応答計画 → 言語化 → 結果評価 → 状態更新
#
# 【既定オフ】既存の動作を変えないため。true にすると通常発話がこの層を
# 通ってから Conversation Planner へ渡る。反射（VAD・割り込み・TTS停止）は
# ここを通らない——待たせたら割り込みが効かなくなる。
#
# 落ちた場合は旧経路で続行するので、会話は止まらない（第17条）。
# ============================================================
cognition:
  # 【止め方は1つ】false にすれば rollout_mode に関わらず従来経路。
  enabled: false
  # どこまで効かせるか。**いきなり全環境で常時ONにしない。**
  #   disabled          : 従来経路
  #   test_session      : 明示的に始めたテストセッション中だけ
  #   profile_allowlist : 下の profiles に挙げたプロファイルだけ
  #   enabled           : 通常動作で有効
  # 実機で試す時の推奨は enabled: true + rollout_mode: test_session。
  rollout_mode: disabled
  profiles: []
  # 「もういいよ」への構え。**固定ルールではなく候補への小さな加点**。
  # どちらが自然かは聞いてみないと分からないので、実機で切り替えて比べる。
  #   adaptive / silent_preferred / brief_ack_preferred
  closure_response_policy: adaptive
  # 黙ると決めた直後に、同じ話題を自分から蒸し返さないための待ち時間。
  # 時間だけでなく topic_id も見る（別件なら話しかけてよい）。
  silence_quiet_seconds: 20
  # 行動候補の点数の重み。**ここ以外に書かない**（既定は
  # neuro_voice/cognition/kernel.py の WEIGHTS）。
  # 実機で回してみないと妥当な値が分からないので、差し替えられるようにしてある。
  weights: {}
    # safety: 1.8          # 危険の警告を通常会話より優先する強さ
    # uncertainty_penalty: 1.3  # 聞き取れていないのに断定することへの罰
    # repetition_penalty: 0.5   # 同じ行動（特に質問）の連投を抑える強さ
  # 1ターンの認知処理を logs/cognitive_trace.jsonl へ1行1JSONで残す。
  # 状態の数値・候補の点数・選んだ理由・所要時間だけで、**会話本文もプロンプトも
  # 思考過程も残さない**（第12条）。既定オフ。通常動作でログを増やさないため。
  trace:
    # **2026-08-04 に有効化。** ペルソナ分離の観測点
    # (retrieved_memory_persona_ids / cross_persona_rejection_count /
    # persona_switch_state など) は、ここが false だと**どこにも残らない**。
    # 会話本文もプロンプトも思考過程も書かない（第12条）ので、
    # 増えるのは1ターン1行の JSON だけ。
    enabled: true
    path: logs/cognitive_trace.jsonl

# エピソード記憶 (Phase 3)。**保存先は既存の mind_*.db のまま**で、
# 新しい記憶基盤は作っていない。memories テーブルへ列を足しただけ。
#
# 【段階的に上げること】3つとも既定 false。順番は
#   1. episodic_enabled  … 覚えるだけ。行動は何も変わらない
#   2. retrieval_enabled … 思い出して行動候補の点数へ効かせる
#   3. reflection_enabled… 複数の経験から会話戦略の仮説を作る
# 一度に全部上げると、おかしくなった時にどれが原因か分からない。
memory:
  # 重要な経験だけをエピソードとして保存する。
  # 挨拶・相づち・重複・低確信のASRは、ここが true でも保存されない。
  episodic_enabled: true
  # 検索だけを実機確認する間の独立した書込みゲート。false ではエピソード、
  # 強化、検索時の access 更新、会話 transcript を DB に書かない。
  write_enabled: false
  # 想起。**探す理由がある時だけ**引く（過去への言及・未完了の約束・
  # 打ち切りの合図・固有名詞）。毎ターン全記憶を取得はしない。
  retrieval_enabled: true
  # 複数の経験から CONVERSATION_STRATEGY の仮説を1つ作る。
  # 会話が止まっている間にだけ走り、**次のターン以降**にしか効かない。
  reflection_enabled: false
  # 過去の記憶を**人物単位**で引く (Phase 6F)。
  #
  # 記憶は speaker_id で保存されている。**書き換えない**——
  # 検索側で「この人物はどの speaker_id か」を束ねるだけ。
  # 束ねても返す件数は増やさない（`max_retrieved` は同じ）。
  identity_scope_retrieval_enabled: false
  # 正式な結果は従来どおりにして、人物単位との**差だけ測る**。
  identity_scope_shadow_read_enabled: false
  # 1ターンで Planner へ渡す記憶の上限。生の会話履歴は渡さない。
  max_retrieved: 3
  # 順位付けの対象にする件数。DBを毎回全部読まないための上限。
  scan_limit: 200
  # これ未満の価値しかない候補は保存しない（importance だけでは決めない。
  # cognition/episodic.py の MemoryCandidate.value を参照）。
  min_value: 0.45
  # 既存記憶とこれ以上似ていたら、新規保存せず REINFORCE / UPDATE する。
  duplicate_similarity: 0.78
  # これ未満の確信の推論は恒久記憶にせず、仮説（low_priority）として置く。
  hypothesis_confidence: 0.60
  # 仮説を作るのに要る重要エピソードの件数。**1件では作らない。**
  reflection_min_episodes: 8

# 持続する内面 (Phase 4)。**新しい感情モデルは作っていない。**
# 既存の TemporalSelf(声の表情づけ) と RelationshipStore(相手ごと17軸) は
# そのまま持ち主で、ここは行動選択用の短期感情(RAMのみ)を足して繋ぐだけ。
#
# 【段階的に上げること】5つとも既定 false。順番は
#   1. enabled           … 状態計算とトレースだけ。行動は変わらない
#   2. affect_enabled    … 出来事から短期感情が動く
#   3. (2の後) Action Selector への補正が効き始める
#   4. planner_expression_enabled     … 口調・返答量へ反映
#   5. relationship_updates_enabled   … 長期の関係値を書く
#   6. preference_updates_enabled     … 好みを連続値で持つ
internal_state:
  # 止め方は1つ。false なら他を何にしても効かない。
  enabled: false
  # 出来事の意味評価から短期感情を動かす。RAMのみで再起動すると消える。
  affect_enabled: false
  # **長期の関係値を書く。** 不明話者では書かない。いちばん最後に上げること
  # ——ここだけが元へ戻せない（ファイルに残る）。
  relationship_updates_enabled: false
  # 好みを連続値と根拠で持つ。「一度楽しかった」で大好きにはならない。
  preference_updates_enabled: false
  # Planner へ口調・距離感・返答量の粗いラベルを渡す。
  planner_expression_enabled: false

# 自分から話す (Phase 5)。**既定では止まっている。**
#
# 【段階的に上げること】
#   1. enabled        … 注意イベントを取り込み、機会を作り、トレースへ残すだけ。
#                       **発話の判断は変わらない**（従来どおり autonomy が決める）
#   2. speech_enabled … 自発発話とゲーム実況が Action Selector を通る。
#                       ここを上げると**沈黙が選ばれて喋らないターンが出る**
#
# speech_enabled は cognition.enabled が true でないと効かない。認知層が
# 止まっているのに自発発話だけ通すと、沈黙の決定も記憶の補正も掛からない
# 発話が復活するため。
initiative:
  # 【段階1を有効化】2026-08-02。**行動は変わらない。**
  # 注意イベントを取り込み、機会を作り、トレースへ残すところまで。
  # 発話を決めるのは従来どおり autonomy（speech_enabled が false のため）。
  enabled: true
  # **これを上げると挙動が変わる。** 段階1のトレースを読んでから。
  speech_enabled: false
  # 段階ごとの入り切り。**下の順に1つずつ上げる。**
  #   attention        … 注意イベントの取り込み（enabled と一緒に効く）
  #   game_commentary  … ゲームイベント起点の実況候補（最初の垂直スライス）
  #   memory_initiative… 記憶起点の候補（未完了の約束・明示された好み）
  #   idle_initiative  … 沈黙中の会話再開
  attention_enabled: true
  game_commentary_enabled: false
  memory_initiative_enabled: false
  idle_initiative_enabled: false
  # **既定 true。** 止める理由は普通は無い——止めると
  # 「相手が話し始めたのに喋り出す」が復活する。
  pre_speech_revalidation_enabled: true
  # 注意イベントの間引き。ここ未満の重要度は候補にしない
  # （危険と直接質問は例外で、重要度では落とさない）。
  min_salience: 0.15
  # 同じ deduplication_key を再び受け付けるまでの秒数。
  dedup_window_s: 4.0
  # 注目対象の乗り換えに要る差と、乗り換え直後に動かさない時間。
  switch_margin: 0.05
  min_dwell_s: 1.5
  # 同じ危険を叫び直すまでの秒数（別の危険は止めない）。
  warn_repeat_s: 6.0
  # ここまで Phase 5。以下は Phase 6。
  # 話しすぎの予算。**回数だけでなく重さも数える** —— 回数だけだと
  # 長い実況を連発しても引っかからない。
  budget:
    window_s: 120.0
    max_utterances: 4
    max_same_topic: 2
    cooldown_s: 8.0
    max_cost: 3.0

# いまどうなっているか (Phase 6)。**完全な世界シミュレーションではない。**
#
# Phase 3 の記憶は「過去に何が起きたか」、ここは「現在どうなっているか」。
# 記憶は増えていくが、現在状況は**古くなって消える**。性質が違うので
# 同じ入れ物へ入れない。
#
# 【段階的に上げること】
#   1. enabled                … 状態を持つだけ。トレースで中身を見る
#   2. entity_tracking_enabled… 人・物・場所を追う
#   3. fact_tracking_enabled  … 「いまこうなっている」を持つ
world_state:
  enabled: false
  entity_tracking_enabled: false
  fact_tracking_enabled: false
  # 実イベントからの取り込み (Phase 6B)。**上げる順は下から。**
  #   observation_wiring → speaker → game → vision → persistence
  observation_wiring_enabled: false
  speaker_observation_enabled: false
  vision_observation_enabled: false
  game_observation_enabled: false
  # 入力元ごとの差を埋める (Phase 6C)。**1つずつ上げる。**
  #   discord_presence: VCの入退室 → 誰が居るか
  #     参加状態の変化から直接発話はしない。注意層まで。
  #   vision_scene_parity: 画面の種類を複数扱い、変化を捉える
  #     種類は vision/service.py のプロンプトが出すものだけ
  #   ktane: 爆弾解除の状態と目標。**会話由来のみ、画面は見ない**
  discord_presence_enabled: false
  vision_scene_parity_enabled: false
  ktane_observation_enabled: false
  # 画面から取る2種類目の事実 (Phase 6D)。既存プロンプトの
  # `player_state.health_estimate` を low/medium/high へ落として持つ。
  # **画面は正本ではない**ので、確信で比べたうえで入れる。
  extended_vision_fact_enabled: false
  # 世界状態の保存。**一時的な事実は起動時に古い扱いへ落ちる。**
  persistence_enabled: false

# 誰なのか (Phase 6D)。**接続・声紋・人物を別々に持つ。**
#
# 1つの番号が3つの違うことを意味していると、声紋が一度外れただけで
# 関係値が別人へ移る。移った先が正しいか確かめる手がかりも残らない。
identity:
  # 出来事ごとに人物を1回だけ決める層。
  resolution_enabled: false
  # Discord のように接続が正本と分かっている音声から、声紋の根拠を積む。
  # **1回では確定しない。** 3回以上の一致が要る。
  voice_transport_linking_enabled: false
  # **既定 true。** 取り消せない統合を作る理由が無い。
  # 誤統合は物理削除せず、REVOKED として残して繋ぎ直す。
  reversible_links_enabled: true

# いま誰が居るのか (Phase 6D)。
#
# **接続が保証する人数と、声から推した人数を分ける。**
# 混ぜると「たぶん3人」が「3人です」として出てくる。
presence:
  registry_enabled: false
  # Local マイクには参加者一覧が無い。声から推し量るが、**確定はしない。**
  # これは実装の不足ではなく環境の制約。確定人数として表示・保存しない。
  local_estimation_enabled: false

# 関係値の主キーを speaker_id から person_id へ移す (Phase 6E)。
#
# **既存データは消さない。** ロールバックは読む先を戻すだけ。
# mode は下から順に上げる:
#   disabled → shadow_read → dual_write → person_primary
#   問題があれば legacy_rollback でいつでも戻せる
#
# 個別フラグと mode が食い違ったら**弱い方**を採る。
# 強い方へ倒すと、間違えて上げた1つのフラグで person 側が正式採用になる。
identity_migration:
  enabled: false
  mode: disabled
  shadow_read_enabled: false
  dual_write_enabled: false
  person_primary_enabled: false
  # 🩺 に移行の区画を出すか。**新しい管理画面は作っていない。**
  ui_enabled: false
  # 何も変えずに「移せるか」だけ見る。**既定で許可**——安全なので。
  dry_run_enabled: true

# 短い計画 (Phase 7)。
#
# **自由な長期自律目標は作らない。** ここが作れるのは、Goal から出た
# 1〜3手の手順だけ。4手以上は計画ではなく自律行動になる。
planning:
  enabled: false
  bounded_plans_enabled: false
  max_steps: 3
  # 作り直してよい回数。**同じ失敗を繰り返したら、そこで止める。**
  max_replans: 1

# 道具の実行 (Phase 7)。
#
# **実機確認が終わるまで全部 false。** 特に外部書き込みと破壊操作は、
# 人物取り違えと Rollback を実機で確かめてからでないと有効にしない。
#
# 有効化の順番:
#   1. 計画と Trace だけ (planning.enabled)
#   2. READ_ONLY を1種類 (read_only_enabled + tools.web_search_enabled)
#   3. Outcome Verification
#   4. 永続化 (persistence_enabled)
#   5. 試験用の書き込み＋確認 (tools.test_scratch_enabled + confirmation)
#   6. 声での確認 (confirmation.voice_confirmation_enabled)
#   7. 限定的な実ツール書き込み
#   8. 通常利用
tool_execution:
  enabled: false
  read_only_enabled: false
  external_write_enabled: false
  destructive_enabled: false
  persistence_enabled: false
  # ツールごとの可否。**台帳にあっても、ここが false なら実行されない。**
  tools:
    web_search_enabled: false
    game_state_enabled: false
    vision_enabled: false
    # 試験用。作業フォルダの中だけ。**本番のサービスへは触らない。**
    test_scratch_enabled: false

# 実行前の確認 (Phase 7)。
#
# **確認は、確認した操作にだけ効く。** 引数が変わったら取り直す。
# 一度の実行で使い切る。別人の了承は流用しない。
confirmation:
  enabled: false
  voice_confirmation_enabled: false
  # 確認が生きている秒数。長すぎると状況が変わってから実行される。
  ttl_seconds: 120

# 道具の結果を会話へ戻す (Phase 7B)。
#
# **一度に全部を有効にしない。** 推奨順:
#   1. テスト環境で result_dialogue
#   2. Local の読み取り専用ツール
#   3. Local 音声で結果報告
#   4. test_scratch 書き込み
#   5. Discord の読み取り専用ツール
#   6. Discord 音声で結果報告
#   7. bounded replan
tools:
  # 結果を Action Selector の候補へ載せる。false なら Phase 7 と同じ
  # ——実行して記録するところで止まる。
  result_dialogue_enabled: false
  # Discord から道具を使う。**同じ Tool Gate を通る。**
  discord_enabled: false
  # 試験用の実書き込み。root が空なら、この値に関係なくツールは動かない。
  test_scratch_enabled: false
  # **書き先を明示する。** 既定を勝手に決めない——「試したつもり」が
  # 本物のプロジェクトファイルの隣に落ちる。
  test_scratch_root: ""
  # 回復可能な読み取り失敗だけ、最大1回作り直す。
  bounded_replan_enabled: false

# 1ターンの追跡・重複防止・ペルソナ分離 (Phase 7C)。
#
# 実機で3つ出た: 同じ文の繰り返し / 応答開始の悪化 / ペルソナ変更後の
# 旧ペルソナらしい反応。**推測で3つ同時に直さない**ための計測と、
# 直した分の切り戻し口。
turn_integrity:
  # 1ターンを同じ turn_id で追う。**会話全文は残さない**——
  # 正規化した文章のハッシュ・文数・文字数・隣接文類似度だけ。
  # **これを true にすると、次に重複が出た時に「どの層で増えたか」が
  # 🩺 と latency ログへ残る。** 有効でも発話の挙動は変わらない
  # （記録するだけ。止めるのは下の duplicate_suppression_enabled）。
  turn_frame_enabled: true
  # 覚えておくターン数と、確定台帳の容量。
  frame_capacity: 64
  commit_capacity: 256
  # **重複を検出したら、その発話を止める。**
  # 既定は false。原因が分からないうちに止めると、重複の代わりに
  # 欠落が出て、しかも今度は記録も残らない。turn_frame_enabled で
  # 層を特定してから上げること。
  duplicate_suppression_enabled: false
  # 工程別のレイテンシを取る。p50/p90/p95 を出すのに要る。
  latency_profiling_enabled: false
  # 何ターン分ためるか。
  latency_capacity: 200
  # 最初の数ターンを集計から外す。**モデルの初回読み込みを含めた
  # 数字で「遅い」と言わない。**
  latency_warmup_turns: 3

  # 明らかな Tool Intent が無いターンで、ツール処理を起動しない。
  # **既定で有効。** 何もしないのが正しい既定なので、上げないと
  # 通常会話が払い続ける。
  skip_tool_path_without_intent: true

  # 隣り合う、ほぼ同一の文だけを1つにする最終防御。
  # **根本原因の修正の代わりにしない。** 原因を直したうえで、
  # それでも出る分だけを畳む。
  collapse_adjacent_duplicates: false

  # ペルソナのスコープを効かせる。DB 検索の時点で人格を絞る。
  persona_scope_enabled: true
  # 所有者もスコープも無い古い記憶を出すか。
  # **既定は出さない。** 「たぶん誰のでもない」で全ペルソナへ
  # 公開すると、実際には誰かの私的な記憶だったものが漏れる。
  # 逆（見えなさすぎる）は「覚えていない」で済むが、こちらは戻せない。
  allow_legacy_unscoped_memory: false
  # ペルソナ切替で会話履歴を捨てる。**旧ペルソナの AI 発話を
  # 新ペルソナの履歴として渡さない。**
  drop_history_on_persona_switch: true

# 共有している目標と未完了の約束 (Phase 6)。
#
# **ポッポが自分で長期目標を作ることはない。** 登録できるのは
# ユーザーが明示した／承認した／明示的な共同作業／自分が引き受けた約束／
# ゲームプロフィールが定義するもの、の5つだけ。
#
# 【段階的に上げること】
#   1. enabled                       … 目標を持つだけ
#   2. obligation_integration_enabled… 既存の未完了事項と繋ぐ
#   3. next_action_enabled           … 次の小さな行動候補を出す
goals:
  enabled: false
  obligation_integration_enabled: false
  next_action_enabled: false
  # 目標の保存。**再起動後、ACTIVE は PAUSED として戻る**——状態を
  # 確かめる前に動き出さないため。
  persistence_enabled: false
  # 既存の未完了事項（WorkingMemory.open_questions）との橋。
  obligation_bridge_enabled: false
  # 同時に抱える ACTIVE な目標の上限。抱えすぎるとどれも進まない。
  max_active: 5

# 行動の許可 (Phase 6B)。**すべてを AUTOMATIC にしない。**
#
# 種類ごとに判定し、分からないものは確認を求める側へ倒す。
# 判定は必ずコード側（`goals.decide_permission`）で、Planner の文章では
# 決めない。
permissions:
  enforcement_enabled: false
