# =============================================
# Neuro Voice AI 設定ファイル
# API キーは .env に書き、${VAR} で参照する
# =============================================

app:
  name: "Neuro Voice AI"

logging:
  level: INFO
  dir: logs

audio:
  input_device: null      # null=既定デバイス。`python run.py --list-devices` で確認
  output_device: null
  # Audio roles are intentionally separate.  Discord's own output route must
  # be selected in the Discord client; this app captures that endpoint only.
  discord_capture_device: "{0.0.0.00000000}.{8690ea0e-1b97-44eb-865f-e1f099b9f94c}"  # soundcard speaker endpoint ID used for Discord loopback
  monitor_output_device: 9   # preferred human monitoring endpoint (informational)
  ai_output_device: 9        # output endpoint for the AI's local VOICEVOX playback
  # 起動後にヘッドセットの電源を入れた場合など、あとから現れたデバイスを拾う間隔。
  # PortAudioはデバイス一覧を起動時にキャッシュするため、定期的に取り直す必要がある。
  # 0 以下にすると監視を止める（従来どおり起動時のデバイスに固定）。
  device_watch_interval_s: 3.0
  sample_rate: 16000
  frame_samples: 512      # Silero VAD は 16kHz / 512サンプル固定
  # Discord通話の聞き取り方法 (DiscordBridgeが使用。DAVE E2EEでBot直接受信が不可のため)
  #   mic     = ループバック未使用 (Discordでは相手の声を聞けない)
  #   loopback= PC出力(Discord通話)をWASAPIループバックで取り込む (相手の声のみ)
  #   mix     = 本人マイク + 通話ループバック (配信者本人+相手 両方をニューロが聞く)
  # ローカル会話(Discord未接続時)は常にマイク。反映はニューロ再起動時。
  input_mode: mix
  loopback_device: "{0.0.0.00000000}.{8690ea0e-1b97-44eb-865f-e1f099b9f94c}"   # loopback/mix時の出力デバイス。null=既定出力(Discordの再生先に合わせる)
  # false: dedicated Discord capture (e.g. Elgato) + separate AI output (e.g. Razer).
  # true: only when AI audio itself is routed into the capture endpoint.
  loopback_mute_on_speak: false
  loopback_mute_tail_s: 1.2     # 発話終了後もこの秒数ミュートを保つ (Discord再生遅延の尻尾対策)

vad:
  threshold: 0.5              # 発話開始判定の確率しきい値
  end_threshold: 0.35         # 発話終了判定のしきい値
  start_frames: 3             # 開始判定に必要な連続フレーム数 (3 ≈ 96ms)
  start_frames_barge_in: 8    # AI発話中の割り込み判定 (エコー誤検知対策で長め)
  end_silence_ms: 400         # この長さ無音が続いたら発話終了
  min_speech_ms: 220          # 「ポチ」など短い呼びかけもSTTへ渡す。短すぎるノイズだけは引き続き無視
  pre_roll_ms: 640            # 発話開始前に遡って含める長さ。
                              # 「えーと」「うん」から話し始める人はここに丸ごと入るので、
                              # 短いと語頭のフィラーごと失われる
  trim_silence: true          # VAD後、Whisperへ渡す発話の前後無音を削る（認識精度・速度を改善）
  onset_threshold: 0.20       # pre_roll内で「ここから声がある」とみなすしきい値。
                              # threshold(0.5)より低くしないと、小さな「うん」が無音扱いで捨てられる
  keep_leading_ms: 160        # 最初に音が出た位置より、さらに手前に残す長さ（子音の立ち上がり用）
  keep_trailing_ms: 80        # 語尾を欠かさないために残す末尾側の無音

realtime:
  # 記憶想起が間に合わないと「昨日の話を覚えていない」状態になるため、
  # 予算は想起が確実に終わる上限にする (想起自体は通常50〜150msで終わる。
  # この値は保険のキャップであり、毎回この時間待つわけではない)。
  context_deadline_ms: 1200      # Maximum wait before starting the LLM with fast context
  speaker_context_wait_ms: 120   # Speaker ID budget; continue in background after this
  memory_recall_budget_ms: 900   # ローカル会話で想起に使う最大時間。超えたら想起なしで即応答

# 疑似フルデュプレックス (Discord)。falseで従来動作へ完全に戻る
full_duplex:
  enabled: true
  soft_interrupt_timeout_ms: 1500   # pause後この時間で判定未確定なら再生を自動再開 (取り残し防止)
  keyword_interrupt_enabled: true   # 「待って/ストップ」等をSTT途中結果で即時ハード割り込み
  extra_interrupt_words: []         # 追加の即断割り込み語 (STTの表記どおり。漢字可)
  echo_guard:                       # スピーカー回り込み (AI自身の声) の音響ガード
    enabled: true
    reference_buffer_s: 6.0         # 送信TTSの参照バッファ長 (秒)
    similarity_threshold: 0.78      # 包絡相関がこの値以上なら回り込みとして破棄
    max_chars: 8                    # この文字数以下の短い発話だけエコー判定する(長い割り込みは飲まない)
  endpoint:                         # 発話終了判定 (フェーズ6)
    enabled: true
    thinking_extra_ms: 400          # 「〜けど」「〜で」等で終わる途中結果 → 終了判定を延長 (小さいほど応答が速い)
    final_reduce_ms: 250            # 「〜です」「〜?」等の文末表現 → 終了判定を短縮 (大きいほど応答が速い)
  control_layer:                    # 会話制御層 (フェーズ7・ルールベース)
    enabled: true
    listener_backchannel: false     # 既定は沈黙。途中理解を装う相槌より正確なターン確定を優先
    listener_cooldown_s: 8          # 相づちの最短間隔 (秒)
    thinking_filler: false          # 繋ぎ発話(テンプレ「えっと」等)は廃止。常に無効(違和感のため)
    filler_cooldown_s: 20           # (未使用) thinking_filler廃止に伴い無効
    contextual_backchannel: false   # partial STTごとのLLM相槌は禁止。必要時もルールベースの最小相槌のみ
    contextual_min_chars: 12        # この文字数以上ユーザーが話した時だけLLM相づちを検討 (短文では黙る)
    contextual_cooldown_s: 18       # (listener_cooldown_sで間隔管理。予備)

barge_in:
  enabled: true               # AI発話中の実質的な割り込みだけ再生を中断
  acknowledgement_max_chars: 12  # これ以下の既知の短い相槌は中断しない

aizuchi:
  enabled: true               # ユーザーの発話が終わった後、応答の先頭に短い相槌を付ける
  response_leadin_probability: 0.38  # 毎回は付けない。話を聞いた時だけ自然に反応する確率

conversation_audio:
  # Barge-in はVAD開始時に即時無音化する。下の旧duck設定は互換用。
  resume_fade_ms: 80          # 相槌・誤検知なら停止位置から短くフェードインして再開
  duck_gain: 0.18             # 旧設定（他経路の互換用）
  duck_fade_ms: 250           # 旧設定（他経路の互換用）
  restore_fade_ms: 180        # 旧設定（他経路の互換用）
  interrupt_fade_ms: 0        # 実質的な割り込み時も待機せず破棄する

stt:
  backend: faster_whisper
  model: large-v3-turbo       # GPU(cuda)時のモデル。日英対応・低遅延
  cpu_model: small            # device:cpu 時に使う軽量モデル。large系はCPUで激遅なので推奨。
                              # 速度優先: base / tiny、精度優先: medium (3950Xでも実用)。null=modelと同じ
  device: cuda                # cpuにするとVRAM節約(cpu_model=small)。GPUなら速い。フェーズ1のVRAM削減でGPU常駐に余裕
  compute_type: int8_float16  # GPU時: int8_float16 が精度ほぼ同等でVRAM約半分・高速 (推奨)。float16も可。cpu時はint8固定
  partial_beam_size: 1        # 途中認識(割り込み語検出)のbeam。1で高速
  final_beam_size: 5          # 確定認識のbeam。候補を5本比較するため2より正確だが少し遅い。beam_size(下)より優先
  cpu_threads: 12             # device: cpu 時の使用スレッド数 (3950X=16コア)
  language: ja                # ja固定で言語判定パスを省略 (CPUでは特に効く)。null=自動判定
  interim: true               # 発話途中の暫定認識を表示 (GPU負荷は増える)
  interim_interval_ms: 1200
  download_root: models
  # beam size = 1語ごとに同時に保持して比較する「認識候補の数」。
  # 1=最速だが誤変換が増えやすい / 5=精度と速度の推奨バランス / 8以上=精度寄りで遅くなる。
  beam_size: 10                # 1〜10で変更可能。固有名詞・同音語の誤認識を減らしたい場合は上げる
  # Whisperは initial_prompt の文体を真似る。整った文だけを書くと「えーと」「うん」
  # などのフィラーを勝手に整形して落とすため、例文にもフィラーを含めておく。
  initial_prompt: "日本語の自然な会話です。えーと、あのー、うーんといった言いよどみも、そのまま書き起こします。"
  keep_fillers: true          # 「うん」「えーと」等の言いよどみを残す。
                              # falseにするとWhisper既定の整形が効き、綺麗だが人間味は減る
  hotwords: "" # 固定語は挿入誤認識を起こすため空。現在のペルソナ名・話者名だけをターンごとに短く渡す
  corrections:
    "おすい": "おみず"
  wake_word_aliases:          # 呼びかけとして単独/区切り直後に出た場合だけ補正 (文中の一般語は変えない)
    ポチ: [ポッチ, おち]
  # 同音異義語の誤変換対策。認識結果を「確定した文字」ではなく「仮説」として扱う。
  # 1) 会話の話題・固有名詞・記憶を毎ターン initial_prompt/hotwords へ流し込み、
  #    Whisperの認識自体を今の文脈へ寄せる (追加コストほぼゼロ)
  # 2) 語ごとの確信度が低く、かつ読みが文脈語と完全一致する語だけ黙って直す
  # 3) 残った不確かな語をLLMへ伝え、漢字の意味でなく読みで捉え直させる
  # 復号ループ(吃音)対策。temperature を 0.0 固定にすると Whisper 自身の
  # 再試行フォールバックが無効になり「最初は、最初は、最初は」が出る。
  temperature_fallback: true    # 壊れたセグメントだけ 0.0→0.2→0.4 で再試行する
  repetition_penalty: 1.0       # 1.0=無効(推奨)。日本語は正当な反復が多く、
                                # 上げると語の置換(誤認識)を誘発する
  no_repeat_ngram_size: 0       # 0=無効。同上の理由で通常は触らない
  transcript_repair:
    enabled: true
    word_confidence: true          # word-level probability を取得 (認識が少し遅くなる)
                                   # 認識が遅いと感じたら false。文脈補正は効いたまま
    word_confidence_threshold: 0.60  # この確信度未満の語を「聴き取りが怪しい」とみなす
    utterance_logprob_threshold: -0.70  # 発話全体がこれ未満なら判定を厳しめにする
    auto_repair: true              # 読みが文脈語と完全一致する場合だけ自動置換
    collapse_stutter: true         # 「最初は、最初は、最初は」のような復号ループを畳む
    max_context_terms: 24          # 読み一致の補正だけに使う語数 (認識には影響しない)
    # ↓ ここから下だけが Whisper の認識自体に影響する。慎重に。
    # 認識へ渡すのは「名前」「今のゲーム名」など検証済みの固有名詞のみ。
    # 会話履歴から拾った語は渡さない (前回の誤認識が次を誤らせる自己強化ループになる)。
    max_bias_terms: 4              # hotwordsへ載せる上限。多いとWhisperがその語を挿入し始める
    bias_via_initial_prompt: false # trueにするとinitial_promptへも載せるが、
                                   # Whisperがプロンプト文をそのまま出力へ漏らすことがある
    ask_when_unresolvable: true    # どう読み替えても意図が取れない時だけ短く聞き返す

llm:
  backend: ollama           # cerebras / openai / openrouter / ollama
  auto_load: true           # 起動時にローカルLLM (Ollama) をVRAMへ事前ロードする
  keep_alive: 10m           # OllamaのVRAM保持時間。Gemma 4の再ロード待ちを減らす
  timeout_sec: 60
  # QAT GGUFのllama-serverがWindowsで異常終了した時だけ、設定を変えずに
  # このモデルへランタイムで一時フォールバックする。空欄ならフォールバックしない。
  ollama_fallback_model: gemma4-12B-it-Q6:latest
  auto_fallback_on_runner_crash: true
  # 会話用コンテキスト長。
  # ※ここだけ上げても効かない。OLLAMA_CONTEXT_LENGTH も同じ値にすること
  #   (SetupOllamaEnv.bat を実行し直す)。サーバ側の上限で頭打ちになる。
  #
  # 【2026-08-01 8192→16384】実ログで毎ターン最大24件の履歴が捨てられていた:
  #   「文脈長のため古い会話を24件除外 (見積8651tok / 予算6912tok / ctx=8192)」
  # systemブロックだけで5000〜6000tokあるため、8192では会話に1000tok強しか
  # 残らなかった。少し前の話を覚えていない直接の原因。
  #
  # 上げる前にVRAMを実測した (tools/check_context_length.py):
  #   num_ctx= 8192: 7,599MB / VRAM 7,599MB — 全部GPU
  #   num_ctx=16384: 7,615MB / VRAM 7,615MB — 全部GPU（+16MBのみ）
  # 倍にしてもほとんど増えないのは、KVキャッシュが q8_0 で量子化され
  # Flash Attention が有効だから。SetupOllamaEnv.bat のその2行を消すと前提が崩れる。
  # 載りきらなくなるとOllamaは層をCPUへ追い出し、応答が数倍遅くなる。
  # 構成を変えたら、上げる前にもう一度 check_context_length.py で測ること。
  num_ctx: 16384
  # 出力のばらつき。**「同じ入力に同じ返答」に直接効く唯一のつまみ。**
  #
  # 2026-08-01時点の実測: 台本8文を4回流して冒頭ハッシュが毎回同じだった。
  # Planner(738tok)を外しても、常時ONを3642→2899tokにしても、履歴が違っても
  # 動かなかった。一方で裸のプロンプトなら同じ入力3回が3種類に割れる
  # (tools/check_sampling.py)。つまりサンプリングは壊れておらず、
  # **巨大なプロンプトが分布を尖らせている**。
  #
  # 0.7 は分布を「さらに尖らせる」向きの値で、根拠なく置かれたまま
  # 一度も検証されていなかった。Gemma 4 自身の推奨は 1.0。
  # 変える前に tools/check_opening_diversity.py で測ること。
  # ばらつきと的確さは引き換えなので、数字だけで決めない。
  temperature: 0.7
  # ↓ サンプリングのつまみ（下段の cognition とは別物）
  # 残りのサンプリングのつまみ。**未設定なら送らない**（モデル自身の推奨値が
  # 使われる。Gemma 4 は top_k 64 / top_p 0.95）。温度だけ動かして様子を見たい
  # 時に、他が固定されていないと切り分けができないので、既定では空にしておく。
  # top_p:
  # top_k:
  # min_p:
  # 1ターンの応答の上限。音声会話では1024で日本語約1000字≒2分半の発話にあたる。
  # num_ctx とは別物で、num_ctx を上げてもここは変わらない
  # (実際の上限は min(max_tokens, num_ctx - プロンプト) になる)。
  max_tokens: 1024           # 思考型モデルは512だと推論で使い切り本文が空になりがち
  # 文脈長は「送る分」と「返す分」で共有される。履歴を往復数だけで打ち切ると、
  # TRPGのような長文ターンでは num_ctx を埋め尽くし、応答が数文字で
  # finish_reason=length になる（＝文の途中で切れる）。
  # 送信前にトークン量で見積もり、この分だけ出力枠を必ず空ける。
  # auto = max_tokens + 余裕。max_tokens を変えると自動で追従するので、
  # 通常は auto のままにしておくこと（固定値だと上げ忘れて再び切れる）。
  context_reserve_tokens: auto
  # プロンプトの内訳と「前回から変わっていない先頭部分」をログへ出す。
  # 初回トークンの遅さがプロンプト評価によるものかを確かめるための計測で、
  # 送る内容は一切変えない。原因が判明したら false にしてよい。
  profile_prompt: true
  # 履歴を切り詰める時、予算ちょうどではなく少し余裕を持って切る。
  #
  # 【現在は 0 = 無効】実測すると、systemブロックだけで5000〜6000トークンあり
  # プロンプトが一度も予算に収まらないため、余裕を持たせても毎ターン切り直しに
  # なる。むしろ予算が下がったぶん履歴を余計に捨てるだけだった（除外件数が
  # 11→13→15→17→19→21と増え続け、再利用率は28〜32%のまま）。
  # systemブロックが小さくなって「収まるターン」が出るようになったら意味を持つ。
  #
  # 【2026-08-01 前提が変わった】num_ctx を 16384 へ上げたので、予算は約15000tok。
  # 実測のプロンプトは7000〜8600tokなので、**今度は収まる**。この設定が意味を持つ
  # 条件は満たされた。ただし収まっている限り切り詰め自体が起きないので、
  # 上げても下げても効果は出ない。**履歴が再び予算を超え始めてから**考えること。
  trim_slack_ratio: 0.0
  # Ollamaへリクエストごとに options(num_ctx / num_predict) を送るか。
  # 最初のトークンまでの約1100msの固定費を切り分けるための切り替え。
  # false にしても num_ctx は OLLAMA_CONTEXT_LENGTH で担保される
  # （SetupOllamaEnv.bat で 16384 を設定する。上の num_ctx と必ず同じ値）。
  send_ollama_options: true
  # 起動時に一度だけ、Ollamaのネイティブ /api/chat へ極小のリクエストを投げて
  # load_duration / prompt_eval_duration / eval_duration を読む。
  #
  # 【既定オフ】2026-07-28の調査は完了した。判明したこと:
  #   ・定常状態のモデル準備は毎回約600ms。num_ctxを8倍にしても+31ms
  #     → KVキャッシュではない
  #   ・モデルは全部GPU上（7599/7599MB） → VRAM不足でもない
  #   ・options付き/なしで差なし → num_ctx指定のせいでもない
  #   ・残る600msはOllamaのリクエストごとの固定処理。設定では動かせない
  #   ・keep_aliveが送信されていない不具合を発見・修正した
  # num_ctxを変えると毎回モデルが再ロードされる（実測7〜16秒）ため、この掃引は
  # 起動のたびに40秒以上GPUを占有し、最初の会話を遅らせる。もう一度測りたい時
  # （Ollamaを更新した、GPU構成を変えた等）だけ true にすること。
  probe_on_start: false
  probe_delay_s: 3.0
  reasoning_effort: none     # 思考型モデルの思考量。none=思考オフ(音声会話は最速)。
                             # low/medium/high=思考ON。空にすると Ollama 既定(自動ON)。
                             # ※Ollamaの think:false は OpenAI互換APIでは効かないためこちらを使用
  backends:
    cerebras:
      base_url: https://api.cerebras.ai/v1
      api_key: ${CEREBRAS_API_KEY}
      model: gemma-4-31b   # 他: gpt-oss-120b (本番向け・推論型) / zai-glm-4.7 (355B)
    openai:
      base_url: https://api.openai.com/v1
      api_key: ${OPENAI_API_KEY}
      model: gpt-4o-mini
    openrouter:
      base_url: https://openrouter.ai/api/v1
      api_key: ${OPENROUTER_API_KEY}
      model: meta-llama/llama-4-scout
    ollama:
      base_url: http://localhost:11434/v1
      api_key: ollama
      model: gemma4:12b-it-qat                # 画像・映像認識対応のGemma 4 12B

tts:
  backend: voicevox           # voicevox / qwen3 / null (音声なし・疎通確認用)
  output_volume: 0.3          # 全TTS共通の最終音量 (0.0〜2.0)。GUI・音声指示で変更可能
  max_chars: 120              # 1回の合成に渡す最大文字数
  prebuffer_s: 0.5            # 合成済みTTSを再生開始前にためる秒数。音切れを防ぐ。
                              # SBV2/VOICEVOXは合成が再生より速く追いつくため小さめで良い。
                              # 短い一文目が続きの合成を待ってしまうのを防ぎ、応答開始が速くなる
  voicevox:
    base_url: http://127.0.0.1:50021
    auto_launch: true         # 起動時にエンジン未起動なら裏でCLI起動する
    engine_path: ""           # 空=自動検出 (%LOCALAPPDATA%\Programs\VOICEVOX\vv-engine\run.exe 等)
    speaker: 2                # 3=ずんだもん(ノーマル)。一覧は <base_url>/speakers
    pronunciations:
      "あんな風": "あんなふう"
      "ずっと側": "ずっとそば"
      "深掘り": "ふかぼり"
      "そんな風": "そんなふう"
      "難問": "なんもん"
      "満員": "まんいん"
      "白旗": "しろはた"
      "大仕事": "おおしごと"
      "他にも": "ほかにも"
      "生米": "なまごめ"
      "雰囲気": "ふんいき"
    speed: 1.0                # 話速 (1.1〜1.2 でキビキビした印象に)
    intonation: 1.0
    volume: 1.0
  style_bert_vits2:           # 感情表現つきTTS。audio_output.backend: style_bert_vits2 で使用
    base_url: http://127.0.0.1:5000
    auto_launch: true         # ツール起動時に未起動なら裏でサーバー起動 (終了時に自動終了)
    path: Style-Bert-VITS2-master\Style-Bert-VITS2  # AItuberフォルダからの相対パス (移動に強い)。絶対パスも可
    device: cuda              # 推奨A: SBV2はGPU (体感で速い)。STTはCPU(small)でVRAMを空ける
    model_name: tsukuyomi       # model_assets 内のフォルダ名。空欄=サーバーの先頭モデル
    speaker_id: 0
    language: JP
    default_style: ノーマル    # 感情写像に該当がない時のスタイル
    style_weight: 1.0         # スタイルの効き (上げすぎると音質が崩れる。0.5〜2.0目安)
    lock_single_style_weight: true  # Neutralしかないモデルは強度を固定し、発音の揺れを防ぐ
    speed: 1.0                # 基準話速 (感情による増減はこの上に掛かる)
    sdp_ratio: 0.2            # 抑揚のランダム性 (0.2=標準、上げると生っぽいが不安定)
    noise: 0.6
    noisew: 0.8
    emotion_styles:           # 感情タグ → モデルのスタイル名 (小春音アミ向け既定)
      neutral: ノーマル
      joy: るんるん
      fun: るんるん
      angry: ノーマル          # amitaroに怒りスタイルはないため通常声+抑揚で表現
      sad: よふかし
      surprised: るんるん
    delivery_styles:          # 話し方タグ → スタイル名 (感情より優先)
      soft: ささやきB（有声）
      calm: よふかし
  qwen3:                      # 感情制御・Voice Clone が必要になったら切替
    model: Qwen/Qwen3-TTS-12Hz-0.6B-CustomVoice
    speaker: Ono_Anna
    language: Auto
    instruct: ""
    device: cuda:0
    dtype: bfloat16
    attn: flash_attention_2

vision:
  enabled: false              # 画像認識。初期状態ではカメラも画像送信も行わない
  provider: local            # ollama=Gemma 4 / claude / google
  model: gemma4:12b-it-qat # Ollamaで vision / audio が有効なGemma 4 12B
  max_image_width: 1280
  max_image_height: 1280
  max_images_per_request: 6
  request_timeout_sec: 45
  explicit_query_wait_timeout_sec: 3.0
  jpeg_quality: 85
  # 常時映像パイプライン。取得と解析は別ワーカーで、解析待ちを会話へ持ち込まない。
  capture_fps: 1.0
  analysis_min_interval_sec: 1.0
  analysis_max_interval_sec: 5.0
  visual_memory_seconds: 30
  raw_frame_memory_seconds: 10
  latest_frame_queue_size: 1 # latest-frame-wins。古い未解析フレームは破棄
  normal_resolution: [640, 360]
  detail_resolution: [1280, 720]
  change_threshold: 0.15
  important_event_threshold: 0.55
  proactive_reaction_enabled: true
  proactive_reaction_cooldown_sec: 6
  proactive_reaction_probability: 0.85 # 変化時は話しやすくしつつ、毎回喋る状態は避ける
  max_visual_context_chars: 1600 # 約300〜400日本語トークン相当
  stale_observation_sec: 2.0
  background_timeout_sec: 15
  circuit_breaker_failures: 3
  circuit_breaker_cooldown_sec: 20
  realtime:
    max_output_tokens: 160   # 状態JSONだけを短く生成し、会話用1024トークン設定を使わない
    context_size: 4096       # 映像解析専用の小さなコンテキストでprefillを短縮
  reactive:
    enabled: true            # 今のゲーム状況への質問だけ、最新OBS画像から直接最終回答する
    max_frame_age_sec: 2.0   # これより古い画像は「リアルタイム」としてLLMへ渡さない
    context_size: 4096       # 人格・直近文脈・攻略根拠を短く詰める高速レーン
    max_output_tokens: 220
    temperature: 0.65        # DBの固定文コピーを避け、状況に合わせて自然に言い換える
  # local=LLMに画像を直接渡す (マルチモーダルLLM必須)
                              # claude=Claude Vision / google=Google Cloud Vision
                              # (外部APIで画像→テキスト説明に変換。ローカルLLMが画像非対応でも使える)
  claude:
    api_key: ${ANTHROPIC_API_KEY}
    model: claude-haiku-4-5-20251001   # 画面説明用 (安価・高速)
    max_tokens: 300
  google:
    api_key: ${GOOGLE_VISION_API_KEY}
  mode: on_demand             # on_demand=発話時に画面を見る / auto=自動実況
  monitor: auto               # auto=操作中のウィンドウがあるモニタを自動選択 (デュアルモニタ向け)
                              # 0=全モニタ結合 / 1,2..=固定モニタ番号
  save_last: false            # 最後の画面をディスクへ保存しない（必要時だけtrueにする）
  max_width: 1024             # 送信前に縮小する最大幅(px)
  # jpeg_quality は上の Gemma/Ollama 用共通設定を使用
  interval_s: 20              # autoモードのコメント間隔 (Cerebras無料枠は5req/分なので12以上)
  auto_prompt: "(これは今の画面のスクリーンショット。実況者として状況に短く一言コメントして)"

video:
  enabled: false              # 明示的にONにした場合だけ映像取得を開始
  input: obs                  # obs推奨 / screen / camera / window(旧直接取得)
  source: 0                   # OpenCV camera index
  screen_monitor: auto        # auto = monitor containing the foreground game window
  window_handle:                                                                                                # 起動中のゲームを自動検出。終了済みHWNDは保存しない
  window_capture_backend: directx # カーソルに干渉しないDXGI常時キャプチャ
  obs:
    host: 127.0.0.1          # OBSが同じPCなら変更不要
    port: 4455               # OBS 28+ obs-websocket既定ポート
    password: ${OBS_WEBSOCKET_PASSWORD} # 設定画面から.envへ保存（yamlへ平文保存しない）
    source_name: マイクラ          # OBSの「ゲームキャプチャ」ソース名。設定画面から選択
    request_timeout_sec: 3.0
    capture_fps: 1.0         # OBSへは1秒に1枚。画面質問時は別途その場で最新フレームを取得
  capture_max_width: 640      # 4Kを送らず、通常解析は640px幅へ縮小
  game_profile: keep_talking_and_nobody_explodes            # set to minecraft for Minecraft-specific observations
  game_commentary_enabled: false
  # プレイ中の明確なアクション・状況変化に、相棒として短く反応する。
  # メニュー、ロード、変化のない画面には反応しない。
  game_commentary_cooldown_sec: 4
  game_commentary_urgent_gap_sec: 1.25
  game_commentary_duplicate_ttl_sec: 30
  game_commentary_pending_ttl_sec: 10
  game_commentary_confidence: 0.55
  target_capture_fps: 5       # カメラ取得。Gemmaへは直接送らない
  analysis_fps: 1
  analysis_interval_sec: 1.0 # 1fps列から、前の意味解析完了後すぐ最新状態を解析
  frame_window_sec: 4.0
  max_frames_per_analysis: 1
  motion_threshold: 0.03
  scene_change_threshold: 0.22
  idle_analysis_interval_sec: 10.0
  max_queue_size: 1           # 互換項目。解析キューは常に最新1枚
  drop_old_frames: true

video_file:
  segment_duration_sec: 10
  max_frames_per_segment: 6
  scene_detection: true
  max_video_duration_sec: 600
  generate_timeline: true

# ゲーム固有設定の目録。各ゲームの定義は game_profiles/<id>/profile.json に置く。
game_profiles:
  root: game_profiles

game_assistant:
  minecraft:
    enabled: true
    direct_quick_answer: false # DB本文をそのまま読み上げず、LLMへ根拠として渡す
    direct_verified_recipe_answer: true # 公式JARで確定できる調理法は映像/LLMを待たず直接回答
    database_path: data/minecraft_knowledge.db
    seed_path: data/minecraft_knowledge.json
    max_context_entries: 3
    edition: java
    version: auto             # auto=ランチャーで直近に遊んだプロファイルと同じバージョン
    minecraft_home: ""        # 空欄なら %APPDATA%/.minecraft
    jar_path: ""              # 通常は空欄。指定時はこの公式/Mod JARを正本にする
    auto_sync_official_data: true # 起動後の初回利用時に公式JARの全レシピを再同期
    verify_spoken_corrections: true # 口頭訂正は公式レシピと一致した場合だけDBへ保存
  keep_talking_and_nobody_explodes:
    enabled: true
    manual_version: 1-ja
    verification_code: "122"

privacy:
  store_camera_frames: false
  store_audio_inputs: false
  redact_media_from_logs: true
  clear_temp_media_on_exit: true

audio_input:
  backend: whisper            # whisper / gemma4_audio (未対応時は下記へ安全にフォールバック)
  fallback_backend: whisper
  gemma4_model: gemma4:12b-it-q4_K_M
  language: ja
  include_emotion: true
  include_non_speech_events: true

audio_output:
  backend: style_bert_vits2           # voicevox / qwen3 / null。Gemma 4はTTSではない
  fallback_backend: voicevox
  voicevox:
    base_url: http://127.0.0.1:50021
    speaker_id: 3
    speed_scale: 1.0
    pitch_scale: 0.0
    intonation_scale: 1.0
    volume_scale: 1.0

search:
  enabled: true              # DeepSearch (Web検索)。「調べて」「最新」「ニュース」等で自動発動
  engine: duckduckgo          # 現在は duckduckgo のみ (APIキー不要)
  max_results: 6              # 複数クエリを横断してLLMに渡す検索結果の総数
  max_queries: 3              # LLMが曖昧さを解消して作る検索クエリ数の上限
  armed_timeout_s: 30         # 「今から言うものを検索して」後に次の発話を待つ秒数
  # LLM計画がこの時間を超えたら、即時クエリで検索を開始する。
  planner_timeout_s: 0.8
  planner_max_chars: 480
  timeout_s: 7.0              # 検索または本文取得1件の最大待機時間
  parallelism: 3              # 複数クエリ・本文ページを同時に取得する数
  fetch_pages: 2              # 本文取得は上位2ページまで（並列）
  page_max_chars: 2400        # 1ページから抽出する本文の最大文字数
  # falseなら検索結果を最終回答LLMへ直接渡し、二度目のLLM待機を省く。
  preextract_enabled: false
  extract_max_chars: 1400     # preextract_enabled時だけ使う抽出LLMメモの上限
  final_context_max_chars: 2400  # 4096ctxでも本文出力領域を残す検索根拠の上限
  speak_notice: true          # 外部検索前に「ちょっと調べてみるね」と短く発話する
  notice_text: "ちょっと調べてみるね。"
  region: jp-jp               # 検索リージョン

# 自律研究は即時Web検索とは別の低優先度キューです。具体的な疑問・目的・失敗
# または「調べておいて」という依頼がある時だけ動き、沈黙を埋めるためには検索しません。
autonomous_research:
  enabled: true
  mode: LOW_RISK_AUTO         # OFF / ASK_FIRST / LOW_RISK_AUTO / FULL_AUTO_WITH_LIMITS
  min_utility: 0.65
  max_per_hour: 2
  max_per_day: 5
  max_concurrent: 1
  max_queries_per_run: 3
  max_sources_per_run: 4
  timeout_seconds: 60
  max_retries: 1
  cooldown_minutes: 30
  duplicate_window_hours: 72
  allow_while_gaming: false
  require_human_present: false
  self_seed_enabled: true     # ペルソナに明記された公開の興味から、理由付きの低リスク研究課題を作る
  self_seed_delay_seconds: 45 # 起動直後の前景初期化と競合させない
  self_seed_cooldown_minutes: 180
  self_seed_retry_minutes: 10
  report_default: REPORT_WHEN_RELEVANT
  history_retention_days: 180
  query_sanitizer_enabled: true
  prompt_injection_guard_enabled: true
  evidence_verification_enabled: true
  require_sources: true
  history_ui_enabled: true
  debug_log: false
  metrics_enabled: true

emotion:
  enabled: true               # 疑似感情。LLMに感情タグを出させ、オーブの色を変える
                              # タグ: neutral / joy(喜) / fun(楽) / angry(怒) / sad(哀) / surprised

user_emotion:
  enabled: true               # Whisperとは別に、ユーザー音声の感情を推定してLLMへ渡す
  timeout_s: 4.0              # 初回モデル読込・推定を待つ上限。超えたターンは感情なしで続行
  opensmile:
    feature_set: eGeMAPSv02   # 音響特徴量。将来の再学習・品質監視にも使用
  speechbrain:
    model: speechbrain/emotion-recognition-wav2vec2-IEMOCAP
    savedir: models/speechbrain_emotion
    device: cpu               # GPUを使う場合は cuda に変更 (LLM/STTとVRAMを共有する点に注意)

style_manager:
  user_emotion_confidence_threshold: 0.75  # これ以上の感情確信度でのみAIの口調を少し補正

proactive:
  enabled: false              # 自発モード。AIが自分から話題を振る・ツッコミを入れる
  min_interval_s: 20          # 自発発話の最短間隔 (この間からランダムに選ぶ)
  max_interval_s: 90          # 自発発話の最長間隔
  quiet_s: 10                 # 会話が終わってからこの秒数は黙る
  min_relevance: 0.70         # 未解決話題などの会話価値がこの値以上の場合のみ自発発話

# 旧 proactive は互換性用に残すだけで、通常は使わない。自律行動が有効な
# 間は、沈黙を埋めるためのランダム発言を行わない。
legacy_spontaneous_mode:
  enabled: false

# 継続的な意図・イベント駆動の自律行動。発話は行動候補の一つであり、
# DO_NOTHING / WAIT / 記憶更新も正常な結果として扱う。
autonomous_action_system:
  enabled: false

autonomy:
  # 専用Heartbeat。Legacy自発モードとは別で、DO_NOTHING後も沈黙を再評価する。
  heartbeat_enabled: true
  heartbeat_interval_ms: 12000      # 沈黙の再評価間隔。短いほど反応の生きた感じが出る
  idle_reevaluation_enabled: true
  idle_llm_call_enabled: true
  idle_llm_prefilter_threshold: 0.52
  min_speech_utility: 0.68
  min_action_utility: 0.58
  do_nothing_base_score: 0.45
  group_speech_threshold_bonus: 0.12
  silence_evaluation_min_ms: 5000
  silence_reevaluation_ms: 10000
  silence_short_ms: 5000
  silence_medium_ms: 15000
  silence_long_ms: 30000
  silence_extended_ms: 90000
  group_idle_min_silence_ms: 30000
  max_silence_triggered_speech_per_5min: 2  # 沈黙起点の発話上限。終了指示後の独り言連発を防ぐ
  post_stop_quiet_seconds: 300              # 継続トーク停止後、自発発話を再開しない時間
  spontaneous_speech_cooldown_ms: 30000   # 自発発話同士の最短間隔。連続独り言を防ぐ
  fresh_topic_min_silence_ms: 18000       # 現在の状況・関心から新しい話題を出せる沈黙時間
  # 過去話題の自動確認は、本人が頼んだ継続とは別物。脈絡のない
  # 「前に言ってた件どうなった？」を防ぐため既定では使わない。
  open_thread_callbacks_enabled: false
  open_thread_recall_cooldown_ms: 900000  # 過去の未完了話題を再確認する間隔（15分）
  followup_callback_after_s: 600          # 未完了話題は会話直後に掘り返さない（10分）
  # 旧・正規表現ベースの継続トーク。behavior_directive.enabled=true の間は
  # 使われない (BehaviorDirective が継続依頼を一元的に扱う)。
  explicit_continuation_segments: 3       # 「しばらく話して」で最初の返答後に続ける区間数
  explicit_continuation_interval_s: 2.5   # 継続トーク区間間の自然な間
  max_self_initiated_questions_per_5min: 3
  max_consecutive_questions: 2
  question_cooldown_ms: 30000
  spontaneous_max_chars_group: 80
  spontaneous_max_chars_one_to_one: 140
  speech_event_max_age_ms: 5000
  open_thread_max_active: 10
  open_thread_max_callbacks: 1
  open_thread_default_ttl_minutes: 30
  micro_agenda_max_items: 8
  recent_event_max_items: 30
  llm_max_concurrent_decisions: 1
  llm_decision_queue_max: 2
  debug_log: false
  metrics_enabled: true

# 継続行動基盤。「しばらく話して」「終わるまで実況して」「一緒に考えて」
# 「静かに見守って」などを、専用エンジンではなく共通のBehaviorDirectiveとして
# 保持し、各区間でLLM自身が次の行動を決める。false で従来の単発応答へ戻る。
behavior_directive:
  enabled: true
  intent_to_plan_enabled: true          # 継続候補の依頼だけ、計画用のLLM呼び出しを1回追加する
  continuation_controller_enabled: true
  max_active_per_conversation: 1        # 同時に走る継続依頼は1つ (初期版)
  default_segment_seconds: 20           # 1区間の目安の長さ
  segment_gap_s: 1.2                    # 次の区間を評価する間隔。再生中も先読み生成する
  # 時間指定のない一人語り（「ラジオやって」等）の既定の長さ。
  # 目標がないとモデルは2〜3区間で自然に締めてしまう。
  default_duration_seconds: 300
  # この時間に満たないうちの FINISH は「締め」ではなく手詰まりとみなし、
  # 話題転換を促して続行する（max_early_finishes 回まで）。
  min_duration_seconds: 120
  max_early_finishes: 2
  segment_max_chars: 500                # 1区間の発話上限。長文の先行生成を防ぐ
  # 計画用のLLM呼び出しは最初の返答と並行して走らせる。返答後にこの秒数だけ待ち、
  # 間に合えばその返答を1区間目として引き継ぐ。間に合わなければ区間側から開始する。
  plan_settle_timeout_s: 8.0
  max_duration_seconds: 1800            # 継続依頼の絶対上限 (30分)
  max_segments: 100                     # 区間数の絶対上限
  max_consecutive_errors: 4             # 連続失敗でFAILEDにする回数。
                                        # ローカルモデルはJSON生成を時々外すので、
                                        # 2だと番組が途中で落ちる
  max_repeated_topic_count: 2           # 同じ話題を繰り返せる回数
  max_loop_detections: 2                # ループ検出がこの回数でDirectiveを終了する
  tts_max_queued_segments: 2            # 再生待ちの区間数上限 (背圧)
  tts_max_ahead_seconds: 15             # 再生より先行してよい秒数 (背圧)
  cancel_output_on_human_speech: true   # 人が話し始めたら未再生の音声を破棄する
  allow_revision: true                  # 継続中の追加指示を新規作成でなく修正として扱う
  loop_detection_enabled: true
  observation_min_importance: 0.55      # 見守りモードで発話候補にするイベント重要度
  persist_short_tasks: false            # 短い継続依頼は再起動で復元しない
  persist_activity_bound_tasks: true    # ゲーム等に紐づく依頼だけ復元候補にする
  status_ui_enabled: true
  debug_log: false
  metrics_enabled: true

# Time is stored per persona as aggregate operational data only: sessions,
# heartbeats, cadence and affect values.  No transcript/audio is written here.
temporal_self:
  enabled: true
  timezone: Asia/Tokyo
  heartbeat_interval_seconds: 30
